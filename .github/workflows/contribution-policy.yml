name: Contribution policy

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]

permissions: {}

concurrency:
  group: contribution-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enforce:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out trusted workflow revision
        # No `ref`: the default self-checkout already resolves to the event's trusted revision
        # (the base branch for `pull_request_target`). Naming one makes actions/checkout inspect
        # it, and `github.workflow_sha` collides with the pull request's own head/merge SHA once
        # the sync pull request has landed, which the fork-PR guard refuses.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce contribution policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { pathToFileURL } = await import("node:url");
            const policyUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/scripts/contribution-policy.ts`,
            );
            const { enforceContributionPolicy } = await import(policyUrl.href);
            await enforceContributionPolicy({ github, context, core });
